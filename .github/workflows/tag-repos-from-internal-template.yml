name: Tag repositories created from template-internal

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-and-apply-ruleset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag repos and assign ruleset
        env:
          GH_TOKEN: ${{ secrets.ADD_TOPCIS_TO_OTHER_REPOS_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TEMPLATE_REPO: template-internal
        run: |
          # Fetch all repos in the organization
          repos=$(gh repo list $OWNER --limit 1000 --json nameWithOwner,id)

          echo "$repos" | jq -r '.[] | "\(.nameWithOwner) \(.id)"' | while read repo repo_id; do
            # Check if repo was created from template-internal
            template=$(gh api "repos/$repo" --jq '.template_repository.name' 2>/dev/null || echo "null")
            
            if [ "$template" = "$TEMPLATE_REPO" ]; then
              echo "Found repo created from $TEMPLATE_REPO: $repo"

              # -------------------
              # Add topics
              # -------------------
              current_topics=$(gh api "repos/$repo/topics" --jq '.names | join(",")' 2>/dev/null || echo "")
              if [[ ! "$current_topics" =~ "keep" ]]; then
                echo "Adding topics to $repo"
                gh api --method PUT -H "Accept: application/vnd.github+json" "/repos/$repo/topics" --input - <<EOF
          {"names": ["keep","internal"]}
          EOF
              else
                echo "Topics already present on $repo"
              fi

              # -------------------
              # Assign ruleset
              # -------------------
              RULESET_NAME="Default branch protection"

              echo "Checking if $repo is already in ruleset $RULESET_NAME"
              existing_repo_ids=$(gh api "/orgs/$OWNER/code-security/rulesets/$RULESET_NAME" --jq '.repository_ids | join(",")')

              if [[ ! ",$existing_repo_ids," =~ ",$repo_id," ]]; then
                echo "Adding $repo to ruleset $RULESET_NAME"
                # Append repo ID to ruleset
                new_repo_ids="$existing_repo_ids,$repo_id"
                gh api --method PATCH -H "Accept: application/vnd.github+json" "/orgs/$OWNER/code-security/rulesets/$RULESET_NAME" --input - <<EOF
          {"repository_ids": [$new_repo_ids]}
          EOF
              else
                echo "$repo is already in ruleset $RULESET_NAME, skipping"
              fi
            fi
          done